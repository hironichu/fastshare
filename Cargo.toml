[package]
name = "fastshare"
version = "0.1.1"
edition = "2021"
authors = ["hironichu"]
license = "MIT"
repository = "https://github.com/hironichu/fastshare"
readme = "README.md"
description = "High-throughput HTTP/2 file sharing server with UPnP IGD, HMAC authentication, rate/download quotas, and live TUI telemetry"
keywords = ["http2", "fileshare", "upnp", "network", "tui"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.7", features = ["http2"] }
tower = "0.5"
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
igd-next = { version = "0.15", features = ["aio_tokio"] }
async_zip = { version = "0.0.17", features = ["tokio", "tokio-fs"] }
tokio-tar = "0.3"
rand = "0.8"
percent-encoding = "2.3"
http-range-header = "0.4"
mime_guess = "2.0"
bytes = "1.7"
futures = "0.3"
chrono = "0.4"
local-ip-address = "0.6"
socket2 = { version = "0.5", features = ["all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
